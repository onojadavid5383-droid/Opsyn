# ============================================================
# OPSYN NGINX CONFIG — infrastructure/nginx/nginx.conf
# Production reverse proxy:
#   HTTP → HTTPS redirect
#   HTTPS → backend API (proxy) + React SPA (static)
#   Rate limiting on /api/v1/auth/*
#   Security headers + Gzip + Long-cache assets
#
# SSL: mount your cert/key at /etc/nginx/ssl/
#   cert: /etc/nginx/ssl/opsyn.crt
#   key:  /etc/nginx/ssl/opsyn.key
# Or use Let's Encrypt with certbot.
# ============================================================

# ── Rate limit zones ─────────────────────────────────────────
# $binary_remote_addr — per client IP
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_limit:20m  rate=60r/m;

# ── Upstream backend pool ────────────────────────────────────
upstream opsyn_backend {
    server backend:8000;
    keepalive 32;
}

# ── HTTP → HTTPS redirect ────────────────────────────────────
server {
    listen 80;
    server_name _;

    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS server ─────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name _;

    # ── TLS ───────────────────────────────────────────────────
    ssl_certificate     /etc/nginx/ssl/opsyn.crt;
    ssl_certificate_key /etc/nginx/ssl/opsyn.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_prefer_server_ciphers on;

    root  /usr/share/nginx/html;
    index index.html;

    # ── Security headers ──────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options           "DENY"          always;
    add_header X-Content-Type-Options    "nosniff"       always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' fonts.googleapis.com; font-src 'self' fonts.gstatic.com data:; img-src 'self' data: blob: https://tile.openstreetmap.org https://tile.openstreetmap.de; connect-src 'self' wss: https:; worker-src blob:;"
        always;

    # ── Gzip ──────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml+rss
        application/x-font-ttf font/opentype image/svg+xml;
    gzip_min_length 1000;

    # ── Static assets — immutable long cache ──────────────────
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Auth endpoints — strict rate limit ────────────────────
    location ~ ^/api/v1/auth/(login|register-tenant) {
        limit_req zone=auth_limit burst=3 nodelay;
        limit_req_status 429;

        proxy_pass         http://opsyn_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── API proxy — general rate limit ────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass         http://opsyn_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout  60s;
        proxy_buffering     on;
        proxy_buffer_size   16k;
        proxy_buffers       4 16k;
    }

    # ── Backend health (internal — proxied) ───────────────────
    location /health {
        access_log off;
        proxy_pass http://opsyn_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ── SPA fallback — React Router ───────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }
}
