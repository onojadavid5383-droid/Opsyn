# ============================================================
# OPSYN BACKEND — pyproject.toml
# All Python dependencies with pinned major versions
# ============================================================

[tool.poetry]
name        = "opsyn-backend"
version     = "2.0.0"
description = "Opsyn Operational Intelligence Platform Backend — Powered by SlimTech"
authors     = ["SlimTech Engineering <dev@slimtech.ng>"]
python      = "^3.12"

[tool.poetry.dependencies]
# ── Web framework ─────────────────────────────────────────────
fastapi            = "^0.115"
uvicorn            = {extras = ["standard"], version = "^0.30"}

# ── Database ──────────────────────────────────────────────────
sqlalchemy         = {extras = ["asyncio"], version = "^2.0"}
asyncpg            = "^0.29"
alembic            = "^1.13"

# ── FTTx Designer engine (geometry_compat shim) ─────────────────
shapely            = "^2.0"
pyproj             = "^3.6"
rtree              = "^1.2"   # QgsSpatialIndex backing — see spatial_index.py

# ── FTTx Designer DED report (Word doc + embedded maps) ──────────
python-docx        = "^1.1"
matplotlib         = "^3.9"
geopandas          = "^1.0"
contextily         = "^1.6"   # OSM basemap tiles for DED report maps; pulls in rasterio

# ── Validation ────────────────────────────────────────────────
pydantic           = "^2.9"
pydantic-settings  = "^2.5"
python-multipart   = "^0.0.9"

# ── Auth & Security ───────────────────────────────────────────
python-jose        = {extras = ["cryptography"], version = "^3.3"}
passlib            = {extras = ["bcrypt"], version = "^1.7"}

# ── Redis & Caching ───────────────────────────────────────────
redis              = {extras = ["asyncio"], version = "^5.0"}
fastapi-limiter    = "^0.1"

# ── Task Queue ────────────────────────────────────────────────
celery             = {extras = ["redis"], version = "^5.4"}

# ── Email ─────────────────────────────────────────────────────
jinja2             = "^3.1"

# ── Logging & Monitoring ──────────────────────────────────────
structlog          = "^24.4"
sentry-sdk         = {extras = ["fastapi"], version = "^2.0"}

[tool.poetry.group.dev.dependencies]
pytest             = "^8.3"
pytest-asyncio     = "^0.23"
httpx              = "^0.27"
factory-boy        = "^3.3"
ruff               = "^0.6"
mypy               = "^1.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

# Strictness is staged. The lint gate had never run before this commit,
# so ~1,000 violations had accumulated. Everything in the F (pyflakes)
# family -- the rules that catch actual defects -- is now clean and
# enforced. The rest is deliberately deferred rather than silently
# dropped; each entry below records why and what it would cost.
[tool.ruff.lint]
select = ["E", "F"]
ignore = [
  "E501",  # line length: governed by line-length above

  # House style. This codebase uses compact one-liners throughout
  # (`if x: return y`) and occasional semicolons. That is a deliberate
  # choice, not an accident, so these stay off.
  "E701",  # multiple statements on one line (colon)    ~119
  "E702",  # multiple statements on one line (semicolon) ~33
  "E401",  # multiple imports on one line                 ~9
  "E741",  # ambiguous variable name                       ~1

  # Deferred, not dismissed.
  "E402",  # import not at top of file: ~3, all deliberate late imports
           # used to break circular dependencies
  "E712",  # `== True`: ~32, most are SQLAlchemy column expressions
           # where `col == True` is valid SQL-generating syntax.
           # Converting to `.is_(True)` needs case-by-case review.
]

# TODO: re-enable "I" (import sorting, ~134) and "UP" (pyupgrade, ~638 --
# mostly Optional[X] -> X | None) once someone can review a large
# mechanical diff. Both are almost entirely auto-fixable; they are left
# out only to keep this commit reviewable.

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = false
